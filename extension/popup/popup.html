<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OverLay-Trans</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>OverLay-Trans</h1>

    <p id="status" class="status">상태 확인 중…</p>

    <label for="code">페어링 코드</label>
    <div class="row">
      <input id="code" type="text" placeholder="47815-XXXXXXXXXXXXXXXX" autocomplete="off" spellcheck="false" />
      <button id="pair" type="button">연결</button>
    </div>
    <p class="hint">OverLay-Trans 앱을 실행하면 표시되는 코드를 입력하세요. 한 번만 입력하면 됩니다.</p>
    <p id="result" class="result" role="status"></p>

    <label class="checkbox">
      <input id="show-source" type="checkbox" />
      원문도 함께 표시
    </label>

    <p id="diagnostics" class="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
